<meta charset="utf-8">
<title>Ten Minute Python</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
<style>
/* Layout concept: a calm home with one big "continue" card, a three-part 10-minute plan and a course grid; lessons are a split screen with the explanation on the left and a live editor + console on the right. */
:root{
  --bg:#f3f6fc; --surface:#ffffff; --surface2:#e9eef9; --ink:#16213a; --muted:#4f5b77; --line:#d6ddee;
  --blue:#2a58cf; --blue-ink:#ffffff; --blue-soft:#e2e9fd;
  --yellow:#ffc933; --yellow-ink:#3a2a00; --yellow-soft:#fff2c9; --flame:#c25a00;
  --green:#12804e; --green-soft:#d9f4e6; --red:#c9382a; --red-soft:#fde3df;
  --code-bg:#111a2e; --code-fg:#e6ebf7; --code-dim:#7c89a8; --code-line:#1d2945;
  --t-k:#ffb26b; --t-b:#7cc6ff; --t-s:#8fe39a; --t-n:#f6d56a; --t-c:#7c89a8; --t-f:#c8aaff;
  --f-disp:'Fredoka','Nunito',system-ui,sans-serif; --f-body:'Nunito','Segoe UI',system-ui,sans-serif; --f-mono:'Fira Code',Consolas,'Courier New',monospace;
  --c1:#2a58cf; --c2:#b3500a; --c3:#12804e; --c4:#c2377f; --c5:#0f7c8a; --c6:#7a4bd6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1325; --surface:#141d35; --surface2:#1c2845; --ink:#e7ecf8; --muted:#a2aecb; --line:#2a3858;
    --blue:#7ba0ff; --blue-ink:#0a1230; --blue-soft:#1c2c58;
    --yellow:#ffd04a; --yellow-ink:#3a2a00; --yellow-soft:#3a3010; --flame:#ff9a3d;
    --green:#4bd68f; --green-soft:#12362a; --red:#ff8a7a; --red-soft:#3d1c1a;
    --c1:#7ba0ff; --c2:#ff9b52; --c3:#4bd68f; --c4:#ff7fba; --c5:#4fd0de; --c6:#b394ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1325; --surface:#141d35; --surface2:#1c2845; --ink:#e7ecf8; --muted:#a2aecb; --line:#2a3858;
  --blue:#7ba0ff; --blue-ink:#0a1230; --blue-soft:#1c2c58;
  --yellow:#ffd04a; --yellow-ink:#3a2a00; --yellow-soft:#3a3010; --flame:#ff9a3d;
  --green:#4bd68f; --green-soft:#12362a; --red:#ff8a7a; --red-soft:#3d1c1a;
  --c1:#7ba0ff; --c2:#ff9b52; --c3:#4bd68f; --c4:#ff7fba; --c5:#4fd0de; --c6:#b394ff;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:0 60px}
h1,h2,h3,h4{font-family:var(--f-disp); font-weight:600; line-height:1.18; margin:0; text-wrap:balance}
p{margin:0 0 .85em}
code,.mono{font-family:var(--f-mono); font-size:.88em; font-variant-ligatures:none}
:not(pre)>code{background:var(--surface2); border-radius:6px; padding:1px 6px}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--blue); outline-offset:2px}
a{color:var(--blue)}
.wrap{max-width:1180px; margin:0 auto}

/* header */
.hd{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); border-bottom:1px solid var(--line); margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--bg); z-index:21}
.hd .wrap{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.logo{display:flex; align-items:center; gap:8px; font-family:var(--f-disp); font-weight:700; font-size:21px; text-decoration:none; color:var(--ink); background:none; border:0; padding:0}
.logo svg{flex:none}
.nav{display:flex; gap:2px; flex:1; min-width:0; overflow-x:auto}
.nav button{background:none; border:0; border-radius:10px; padding:7px 13px; font-weight:700; color:var(--muted); white-space:nowrap}
.nav button:hover{background:var(--surface2)}
.nav button[aria-current="page"]{background:var(--blue-soft); color:var(--blue)}
.stats{display:flex; gap:8px; align-items:center}
.pillstat{display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:99px; padding:4px 12px; font-weight:800; font-size:15px; white-space:nowrap}
.pillstat.hot{color:var(--flame)}
.pillstat.cold{color:var(--muted)}
.pillstat small{font-weight:600; color:var(--muted); font-size:13px}
.iconbtn{border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:4px 12px; font-size:14px; font-weight:700}

/* generic */
.view{padding-top:26px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:2px solid var(--blue); background:var(--blue); color:var(--blue-ink); border-radius:12px; padding:9px 20px; font-weight:800; font-size:16px; text-decoration:none; transition:transform .08s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:transparent; color:var(--blue)}
.btn.good{background:var(--green); border-color:var(--green); color:#fff}
.btn.sm{padding:5px 14px; font-size:14.5px; border-radius:10px}
.btn:disabled{opacity:.45; cursor:default; transform:none}
.btn.yel{background:var(--yellow); border-color:var(--yellow); color:var(--yellow-ink)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:22px}
.eyebrow{font-family:var(--f-disp); font-size:14px; letter-spacing:.07em; text-transform:uppercase; color:var(--blue); font-weight:600; margin-bottom:6px}
.muted{color:var(--muted)}
.row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.bar{height:10px; background:var(--surface2); border-radius:99px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--green); border-radius:99px; transition:width .4s}
.bar.xp i{background:var(--yellow)}

/* home */
.home{display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:26px; align-items:start}
.hero h1{font-size:clamp(30px,5vw,46px); letter-spacing:-.01em}
.hero p{font-size:19px; color:var(--muted); max-width:46ch; margin-top:8px}
.cont{display:grid; grid-template-columns:auto 1fr auto; gap:18px; align-items:center; background:var(--blue); color:var(--blue-ink); border-radius:20px; padding:20px 24px; margin:22px 0}
.cont .t small{display:block; opacity:.85; font-weight:700}
.cont .t b{font-family:var(--f-disp); font-size:24px; font-weight:600; line-height:1.2}
.cont .btn{background:var(--yellow); border-color:var(--yellow); color:var(--yellow-ink)}
.plan{display:grid; gap:10px; margin:12px 0 28px}
.plan .it{display:grid; grid-template-columns:34px 1fr auto; gap:14px; align-items:center; padding:14px 16px; border:1px solid var(--line); border-radius:14px; background:var(--surface)}
.plan .it .n{width:34px; height:34px; border-radius:50%; background:var(--surface2); display:grid; place-items:center; font-weight:800}
.plan .it.ok .n{background:var(--green); color:#fff}
.plan .it b{display:block; font-size:17px}
.plan .it small{color:var(--muted); font-size:14.5px}
.sect{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:8px 0 10px}
.sect h2{font-size:26px}
.courses{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px}
.course{display:flex; flex-direction:column; gap:10px; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px; cursor:pointer; min-width:0}
.course:hover{border-color:var(--cc,var(--blue)); box-shadow:0 6px 18px rgba(20,30,60,.08)}
.glyph{width:54px; height:54px; border-radius:14px; display:grid; place-items:center; font-family:var(--f-mono); font-weight:500; font-size:17px; color:#fff; background:var(--cc,var(--blue)); flex:none}
:root[data-theme="dark"] .glyph{color:#0c1325}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .glyph{color:#0c1325}}
.course h3{font-size:20px}
.course p{font-size:15.5px; color:var(--muted); margin:0}
.course .meta{display:flex; justify-content:space-between; font-size:14px; color:var(--muted); font-weight:700}
.tag{display:inline-block; background:var(--yellow-soft); color:var(--ink); font-weight:800; font-size:12.5px; border-radius:99px; padding:1px 10px; align-self:flex-start}
.tag.done{background:var(--green-soft); color:var(--green)}
.side{display:grid; gap:16px; position:sticky; top:84px}
.side h3{font-size:18px; margin-bottom:8px}
.streakbox{text-align:center}
.streakbox .big{font-family:var(--f-disp); font-weight:700; font-size:54px; line-height:1; color:var(--flame)}
.streakbox.cold .big{color:var(--muted)}
.week{display:flex; justify-content:space-between; margin-top:12px}
.week span{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:12.5px; font-weight:800; color:var(--muted)}
.week i{width:26px; height:26px; border-radius:50%; background:var(--surface2); display:grid; place-items:center}
.week i.on{background:var(--flame); color:#fff}
.week i.today{outline:2px solid var(--blue); outline-offset:2px}
.ringbox{display:flex; align-items:center; gap:16px}
.ringwrap{position:relative; flex:none}
.ringwrap b{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--f-disp); font-size:19px}
.welcome{margin:18px 0; border:2px dashed var(--blue); background:var(--blue-soft)}
.welcome input,.welcome select,.field input,.field select,.field textarea{font:inherit; background:var(--surface); color:var(--ink); border:2px solid var(--line); border-radius:10px; padding:8px 12px; max-width:100%}
.field{display:flex; flex-direction:column; gap:4px; min-width:0}
.field label{font-weight:800; font-size:15px}

/* course page */
.crumb{background:none; border:0; color:var(--blue); font-weight:800; padding:0; margin-bottom:10px}
.chead{display:flex; gap:18px; align-items:center; flex-wrap:wrap; margin-bottom:22px}
.chead h1{font-size:clamp(28px,4.5vw,40px)}
.lessons{display:grid; gap:10px; max-width:820px}
.lrow{display:grid; grid-template-columns:42px 1fr auto; gap:14px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; text-align:left; width:100%}
.lrow:hover{border-color:var(--blue)}
.lrow .n{width:42px; height:42px; border-radius:50%; background:var(--surface2); display:grid; place-items:center; font-weight:800}
.lrow.done .n{background:var(--green); color:#fff}
.lrow b{display:block}
.lrow small{color:var(--muted)}

/* player */
.player{display:flex; flex-direction:column; gap:14px}
.ptop{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.back{background:none; border:1px solid var(--line); border-radius:10px; padding:5px 12px; font-weight:800; background:var(--surface)}
.ptitle small{display:block; color:var(--muted); font-weight:700; font-size:13.5px}
.ptitle b{font-family:var(--f-disp); font-size:20px; font-weight:600}
.segs{display:flex; gap:5px; flex:1; min-width:140px; max-width:420px}
.segs i{flex:1; height:9px; border-radius:99px; background:var(--surface2)}
.segs i.done{background:var(--green)}
.segs i.cur{background:var(--blue)}
.pbody{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,6fr); gap:18px; align-items:start}
.pbody.single{grid-template-columns:minmax(0,760px); justify-content:center}
.pane{min-width:0}
.txt{padding:24px clamp(16px,2.4vw,28px)}
.txt h2{font-size:28px; margin-bottom:12px}
.prose p,.prose li{font-size:17.5px}
.prose ul,.prose ol{padding-left:22px; margin:0 0 .9em}
.prose li{margin-bottom:4px}
.tip,.words,.try{border-radius:14px; padding:12px 16px; margin:14px 0; font-size:16.5px}
.tip{background:var(--yellow-soft); display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:center}
.tip svg{flex:none}
.tip p{margin:0}
.words{background:var(--blue-soft)}
.words b{font-weight:800}
.words .wh{font-family:var(--f-disp); font-weight:600; display:block; margin-bottom:2px; font-size:17px}
[hidden]{display:none!important}
.try{background:var(--green-soft)}
.try b.l{font-family:var(--f-disp); font-weight:600}
.snip{background:var(--code-bg); color:var(--code-fg); border-radius:12px; padding:12px 16px; font-family:var(--f-mono); font-size:14.5px; overflow-x:auto; margin:10px 0 14px; line-height:1.6; white-space:pre; font-variant-ligatures:none}
.snip i{font-style:normal}
.snip .c{color:var(--t-c)} .snip .k{color:var(--t-k)} .snip .b{color:var(--t-b)} .snip .s{color:var(--t-s)} .snip .n{color:var(--t-n)} .snip .f{color:var(--t-f)}
.snip.outp{background:#0a101f; color:#d7ffe0; border-left:4px solid var(--green)}
.codecard{border-radius:16px; overflow:hidden; background:var(--code-bg); border:1px solid var(--code-line)}
.cbar{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 12px; color:var(--code-dim); font-size:13.5px; font-weight:700; border-bottom:1px solid var(--code-line); flex-wrap:wrap}
.ed{--lh:23px; display:grid; grid-template-columns:auto 1fr; max-height:380px; min-height:150px; overflow:auto; font-family:var(--f-mono); font-size:14.5px; line-height:var(--lh); font-variant-ligatures:none; tab-size:4}
.gut{position:sticky; left:0; z-index:1; background:var(--code-bg); color:var(--code-dim); text-align:right; padding:12px 10px 12px 14px; user-select:none; border-right:1px solid var(--code-line)}
.gut span{display:block; height:var(--lh)}
.gut span.bad{color:#fff; background:var(--red); border-radius:4px; margin-right:-4px; padding-right:4px}
.cw{display:grid; padding:12px 16px; min-width:0}
.cw>*{grid-area:1/1; margin:0; font:inherit; line-height:inherit; letter-spacing:0; white-space:pre; tab-size:4; word-spacing:0}
.hl{color:var(--code-fg); pointer-events:none}
.hl .c{color:var(--t-c); font-style:italic} .hl .k{color:var(--t-k)} .hl .b{color:var(--t-b)} .hl .s{color:var(--t-s)} .hl .n{color:var(--t-n)} .hl .f{color:var(--t-f)}
.hl i{font-style:normal}.hl i.c{font-style:italic}
.ta{background:transparent; color:transparent; caret-color:#fff; border:0; outline:0; resize:none; overflow:hidden; padding:0; width:100%; height:100%; min-width:0; z-index:1}
.ta::selection{background:rgba(124,166,255,.4); color:transparent}
.actions{display:flex; gap:8px; flex-wrap:wrap; padding:10px 12px; border-top:1px solid var(--code-line); background:#0d1528}
.actions .btn.sec{color:#cfe0ff; border-color:#3a4c7a}
.con{margin-top:12px; border-radius:16px; background:#0a101f; border:1px solid var(--code-line); color:#d7ffe0; overflow:hidden}
.con .cbar{color:#8fa0c8}
.mini{background:transparent; border:1px solid #3a4c7a; color:#cfe0ff; border-radius:8px; padding:1px 10px; font-size:12.5px; font-weight:700}
.cbody{padding:12px 16px; min-height:110px; max-height:320px; overflow:auto; font-family:var(--f-mono); font-size:14.5px; line-height:1.55; font-variant-ligatures:none}
.cbody pre{margin:0; font:inherit; white-space:pre-wrap; overflow-wrap:anywhere}
.cbody .ph{color:#7c89a8; font-family:var(--f-body); font-size:15px}
.cbody input{font:inherit; background:#1b2744; border:1px solid #3a4c7a; color:#fff; border-radius:6px; padding:0 6px; min-width:6ch; max-width:100%; outline:0}
.errcard{background:var(--red-soft); color:var(--ink); border-radius:12px; padding:12px 14px; margin-top:10px; font-family:var(--f-body); font-size:15.5px; line-height:1.5}
.errcard b{font-family:var(--f-disp); font-weight:600; font-size:17px; color:var(--red); display:block}
.errcard p{margin:4px 0}
.banner{border-radius:14px; padding:14px 16px; margin-top:16px; font-size:16.5px}
.banner.ok{background:var(--green-soft); border:2px solid var(--green)}
.banner.no{background:var(--red-soft); border:2px solid var(--red)}
.banner b{font-family:var(--f-disp); font-weight:600; font-size:19px; display:block; margin-bottom:2px}
.banner pre{margin:6px 0 0; font-family:var(--f-mono); font-size:13.5px; white-space:pre-wrap; background:var(--surface); border-radius:8px; padding:6px 10px; overflow-wrap:anywhere}
.under{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px}
.hintbox{background:var(--yellow-soft); border-radius:12px; padding:10px 14px; margin-top:12px; font-size:16px}
.opts{display:grid; gap:10px; margin:16px 0}
.opt{text-align:left; background:var(--surface); border:2px solid var(--line); border-radius:14px; padding:12px 16px; font-size:17px; font-weight:600}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.right{border-color:var(--green); background:var(--green-soft)}
.opt.wrong{border-color:var(--red); background:var(--red-soft)}
.opt code{background:transparent}

/* overlay + fx */
.overlay{position:fixed; inset:0; z-index:40; background:rgba(8,14,30,.6); display:grid; place-items:center; padding:16px}
.modal{background:var(--surface); border-radius:22px; padding:28px; max-width:460px; width:100%; text-align:center}
.modal h2{font-size:30px; margin:6px 0}
.modal .xpbig{font-family:var(--f-disp); font-size:42px; font-weight:700; color:var(--flame)}
.modal .row{justify-content:center; margin-top:16px}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:max(20px,env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:11px 20px; border-radius:12px; font-weight:700; z-index:60; max-width:calc(100vw - 32px); box-shadow:0 10px 30px rgba(0,0,0,.3)}
#fx{position:fixed; inset:0; pointer-events:none; z-index:50; overflow:hidden}
#fx i{position:absolute; top:-12px; width:10px; height:14px; border-radius:2px; animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg); opacity:.9}}

/* profile, cheat sheet */
.grid3{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px}
.stat b{display:block; font-family:var(--f-disp); font-size:30px; font-weight:600}
.stat small{color:var(--muted); font-weight:700}
.heat{display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,16px); gap:4px; overflow-x:auto; padding-bottom:4px}
.heat i{width:16px; height:16px; border-radius:4px; background:var(--surface2)}
.heat i.l1{background:color-mix(in srgb,var(--green) 35%,var(--surface2))} .heat i.l2{background:color-mix(in srgb,var(--green) 65%,var(--surface2))} .heat i.l3{background:var(--green)}
.badges{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px}
.badge{display:grid; grid-template-columns:44px 1fr; gap:12px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px}
.badge .g{width:44px; height:44px; border-radius:50%; background:var(--yellow); color:var(--yellow-ink); display:grid; place-items:center; font-weight:800; font-family:var(--f-disp)}
.badge.lock{opacity:.55}
.badge.lock .g{background:var(--surface2); color:var(--muted)}
.badge b{display:block; font-size:15.5px; line-height:1.2}
.badge small{color:var(--muted); font-size:13.5px; line-height:1.3; display:block}
.cert{border:3px double var(--yellow); background:var(--surface); border-radius:18px; padding:30px; text-align:center}
.cert h2{font-size:34px}
.cert .nm{font-family:var(--f-disp); font-size:40px; color:var(--blue); margin:10px 0}
.acc details{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:4px 16px; margin-bottom:10px}
.acc summary{font-family:var(--f-disp); font-weight:600; font-size:20px; padding:10px 0; cursor:pointer}
.chitem{padding:8px 0 14px; border-top:1px solid var(--line)}
.chitem h4{font-size:17px; font-family:var(--f-body); font-weight:800; margin-bottom:2px}
.gl{display:grid; gap:8px}
.gl div{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 14px}
.gl b{font-family:var(--f-mono); font-size:15px; color:var(--blue)}
textarea.big{width:100%; min-height:110px; font-family:var(--f-mono); font-size:13px; background:var(--surface); color:var(--ink); border:2px solid var(--line); border-radius:10px; padding:8px 10px}
.pg{max-width:900px; margin:0 auto}

async function runChecks(step,code){
  var res=[], ok=true;
  for(var i=0;i<step.tests.length;i++){
    var t=step.tests[i];
    if(t.s){ var src=t.raw?code:code.replace(/^\s*#.*$/gm,''); var pass=t.s.test(src); res.push({ok:pass,msg:t.m||'Your code is missing something we asked for.'}); if(!pass)ok=false; continue }
    var prog=code+(t.a?'\nprint("<<TEST>>")\n'+t.a+'\n':'');
    var r=await execHeadless(prog,t.i||[]);
    if(r.err){ok=false; res.push({ok:false,err:friendly(r.err),t:t}); continue}
    var got=r.out; if(t.a){var ix=got.indexOf('<<TEST>>\n'); got=ix>=0?got.slice(ix+9):''}
    got=norm(got); var pass2=t.r?t.r.test(got):got===norm(t.o);
    if(!pass2)ok=false; res.push({ok:pass2,got:got,t:t});
  }
  return {ok:ok,res:res};
}

  var f=bad[0], d='';
  if(f.msg)d='<p style="margin:6px 0 0">'+esc(f.msg)+'</p>';
  else if(f.err){d='<p style="margin:6px 0 0">Your code stopped with an error ('+esc(f.err.type)+(f.err.line?' on line '+f.err.line:'')+'): <code>'+esc(f.err.msg)+'</code>. Press Run to see friendly help.</p>'}
  else{ var t=f.t; d='<p style="margin:6px 0 0">'+(t.i?'When the answers typed in are <code>'+esc(t.i.join(', '))+'</code>:':'Your output does not match yet.')+'</p>'+(t.o!==undefined?'<p style="margin:6px 0 0">We expected:</p><pre>'+esc(norm(t.o)||'(nothing)')+'</pre>':'<p style="margin:6px 0 0">'+esc(t.m||'The output is not what we asked for.')+'</p>')+'<p style="margin:6px 0 0">Your code printed:</p><pre>'+esc(f.got||'(nothing)')+'</pre>' }
  return '<div class="banner no" style="margin-top:16px"><b>Not quite yet</b>'+(r.res.length>1?'<span>'+(r.res.length-bad.length)+' of '+r.res.length+' checks passed. </span>':'')+'Here is the first thing that did not match.'+d+'</div>';
}

async function doRun(){
  if(!P||!P.ed||RUNNING)return; var s=P.seq.steps[P.i];
  var rb=$('#runBtn'), sb=$('#stopBtn'); if(rb)rb.disabled=true; if(sb)sb.hidden=false; P.ed.mark(0);
  var r=await runInConsole(P.ed.get(),P.con);
  if(rb)rb.disabled=false; if(sb)sb.hidden=true;
  if(r.ok){store.stats.runs++; checkBadges(); save()} else if(r.err&&r.err.line)P.ed.mark(r.err.line);
}
async function doCheck(){
  if(RUNNING)return; var s=P.seq.steps[P.i], btn=$('#checkBtn'); btn.disabled=true; btn.textContent='Checking...';
  var code=P.ed.get(), r=await runChecks(s,code); btn.disabled=false; btn.textContent='Check my code';
  var fb=$('#fb');
  if(r.ok){
    P.passed=true; var gain=0;
    if(!P.seq.noXp){ var k=stepKey(P.seq,P.i); if(!k||!store.steps[k]){ gain=P.peeked?8:(P.tries===0?20:15); if(k)store.steps[k]=1; addXP(gain); if(s.fix&&!P.peeked){store.stats.fixes++} dset().steps++ } }
    if(P.seq.kind==='daily')P.seq.gain=gain;
    var last=P.i===P.seq.steps.length-1;
    fb.innerHTML='<div class="banner ok"><b>'+(P.tries===0&&!P.peeked?'Perfect, first try!':'You got it!')+'</b>'+(gain?'+'+gain+' XP. ':'')+'Every check passed.</div>';
    $('#under').innerHTML='<button class="btn good" type="button" data-act="next">'+(last?'Finish':'Continue')+' →</button>';

  }
}
function lessonFinished(){

async function pgRun(){ if(RUNNING)return; var rb=$('#runBtn'), sb=$('#stopBtn'); rb.disabled=true; sb.hidden=false; P.ed.mark(0); var r=await runInConsole(P.ed.get(),P.con); rb.disabled=false; sb.hidden=true; if(r.ok){store.stats.runs++; store.stats.pgRuns++; checkBadges(); save()} else if(r.err&&r.err.line)P.ed.mark(r.err.line) }
function viewCheat(){
  ACTIVE=true; setNav('cheatsheet');
  var acc=PC.cheat.map(function(s,i){return '<details'+(i===0?' open':'')+'><summary>'+esc(s.t)+'</summary>'+s.items.map(function(it){return '<div class="chitem"><h4>'+esc(it.h)+'</h4><div class="snip">'+highlight(it.code)+'</div><p class="muted" style="margin:0 0 6px;font-size:15.5px">'+it.n+'</p><button class="btn sm sec" data-try="'+esc(it.code)+'">Try it</button></div>'}).join('')+'</details>'}).join('');
  var gl=PC.gloss.map(function(g){return '<div><b>'+esc(g.w)+'</b> '+g.d+'</div>'}).join('');
  view.innerHTML='<div class="pg"><div class="eyebrow">Reference</div><h1 style="font-size:34px;margin-bottom:6px">Python cheat sheet</h1><p class="muted">Forgot how something works? Look here. Press "Try it" to open the example in the Playground.</p><div class="acc">'+acc+'</div><h2 style="margin:26px 0 10px;font-size:26px">Words to know</h2><div class="field" style="max-width:320px;margin-bottom:10px"><label for="glq">Search words</label><input type="text" id="glq" placeholder="variable, loop, string..."></div><div class="gl" id="gl">'+gl+'</div></div>';
  $('#glq').addEventListener('input',function(e){var q=e.target.value.toLowerCase(); $('#gl').innerHTML=PC.gloss.filter(function(g){return (g.w+g.d).toLowerCase().indexOf(q)>-1}).map(function(g){return '<div><b>'+esc(g.w)+'</b> '+g.d+'</div>'}).join('')||'<div>No match. Try another word.</div>'});
}
function viewProfile(){
  ACTIVE=false; setNav('profile'); var lv=level(), tot=0; Object.keys(store.days).forEach(function(k){tot+=store.days[k].sec});
  var ld=Object.keys(store.done).length, la=allLessons().length;
  var heat='', today=new Date(), start=addDays(today,-(7*12-1)-((today.getDay()+6)%7)); for(var i=0;i<7*12;i++){var x=addDays(start,i); if(x>today){heat+='<i style="visibility:hidden"></i>';continue} var d=dget(ymd(x)), p=d.sec/(store.goal*60), cl=d.sec<60?'':p>=1?'l3':p>=.5?'l2':'l1'; heat+='<i class="'+cl+'" title="'+ymd(x)+': '+Math.floor(d.sec/60)+' min"></i>'}
  var bd=BADGES.map(function(b){var on=store.badges[b[0]]; return '<div class="badge '+(on?'':'lock')+'"><span class="g">'+esc(b[4])+'</span><div><b>'+esc(b[1])+'</b><small>'+esc(b[2])+'</small></div></div>'}).join('');
  var cert=allDone()?'<div class="cert" style="margin:18px 0"><div class="eyebrow">Certificate</div><h2>Python Basics</h2><p class="muted">This certifies that</p><div class="nm">'+esc(store.name||'You')+'</div><p>finished every lesson in Ten Minute Python: printing, variables, text, decisions, lists, loops, functions, dictionaries and debugging.</p><p class="muted" style="margin:0">'+ymd()+'</p></div>':'<div class="card" style="margin:18px 0"><h3>Certificate</h3><p class="muted" style="margin:4px 0 8px">Finish all '+la+' lessons to unlock your Python Basics certificate. You have done '+ld+'.</p><div class="bar"><i style="width:'+(ld/la*100)+'%"></i></div></div>';
  view.innerHTML='<div class="pg"><div class="eyebrow">Profile</div><h1 style="font-size:34px;margin-bottom:14px">'+(store.name?esc(store.name):'Your')+' progress</h1><div class="grid3"><div class="stat"><b>'+streak()+'</b><small>Current streak (days)</small></div><div class="stat"><b>'+bestStreak()+'</b><small>Best streak</small></div><div class="stat"><b>'+store.xp+'</b><small>XP · level '+lv.n+' '+esc(lv.name)+'</small></div><div class="stat"><b>'+ld+'/'+la+'</b><small>Lessons done</small></div><div class="stat"><b>'+Math.round(tot/60)+'</b><small>Minutes learned</small></div></div>'+cert+
   '<h2 style="font-size:24px;margin:24px 0 10px">Last 12 weeks</h2><div class="card"><div class="heat">'+heat+'</div><p class="muted" style="margin:10px 0 0;font-size:14.5px">Darker green means more of your daily goal.</p></div>'+
   '<h2 style="font-size:24px;margin:24px 0 10px">Badges</h2><div class="badges">'+bd+'</div>'+
   '<h2 style="font-size:24px;margin:24px 0 10px">Settings</h2><div class="card"><div class="row" style="align-items:end"><div class="field"><label for="setName">Your name</label><input id="setName" type="text" maxlength="24" value="'+esc(store.name)+'"></div><div class="field"><label for="setGoal">Daily goal</label><select id="setGoal">'+[5,10,15,20].map(function(m){return '<option value="'+m+'"'+(m===store.goal?' selected':'')+'>'+m+' minutes</option>'}).join('')+'</select></div><button class="btn" data-act="saveset">Save</button></div></div>'+
   '<h2 style="font-size:24px;margin:24px 0 10px">Back up your progress</h2><div class="card"><p class="muted" style="margin-top:0">Progress is saved in this browser only. If you clear your browser data it is gone, so copy this text somewhere safe now and then. To restore, paste it back and press Import.</p><textarea class="big" id="bk" aria-label="Progress backup text" spellcheck="false">'+esc(JSON.stringify(store))+'</textarea><div class="row" style="margin-top:10px"><button class="btn sec sm" data-act="copybk">Copy</button><button class="btn sec sm" data-act="impbk">Import</button><button class="btn sec sm" data-act="reset1" id="rs" style="margin-left:auto;color:var(--red);border-color:var(--red)">Reset everything</button></div></div></div>';
}

/* ---------- routing ---------- */
function go(h){ if(location.hash==='#'+h){route()} else location.hash=h }
function route(){
  $('#modalHost').innerHTML=''; RUNNING=false; var h=location.hash.slice(1)||'home', m;
  if(P&&P.con)P.con.cancelInput&&P.con.cancelInput();
  P=null; window.scrollTo(0,0);
  if(h==='home')viewHome();
  else if((m=h.match(/^c-([a-z0-9]+)$/)))viewCourse(m[1]);
  else if((m=h.match(/^l-([a-z0-9]+)-(\d+)$/))){setNav('home'); viewLesson(m[1],+m[2])}
  else if(h==='warmup'){setNav('home'); viewWarm()}
  else if(h==='challenge'){setNav('home'); viewChallenge()}
  else if(h==='playground')viewPlayground();
  else if(h==='cheatsheet')viewCheat();
  else if(h==='profile')viewProfile();
  else viewHome();
  updateHeader();
}
window.addEventListener('hashchange',route);
function exitPlayer(){ go(P&&P.seq&&P.seq.back||'home') }

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-go]'); if(t){ e.preventDefault(); go(t.dataset.go); return }
  var tr=e.target.closest('[data-try]'); if(tr){ store.pg=tr.dataset.try; save(); go('playground'); return }
  var o=e.target.closest('[data-opt]'); if(o&&P&&P.seq){ quizPick(+o.dataset.opt); return }
  var a=e.target.closest('[data-act]'); if(!a)return; var act=a.dataset.act;
  if(act==='exit')exitPlayer();
  else if(act==='run')doRun();
  else if(act==='pgrun')pgRun();
  else if(act==='stop'){stopRun(P.con)}
  else if(act==='reset'){var s=P.seq.steps[P.i]; P.ed.set(s.k==='learn'?s.code:s.starter)}
  else if(act==='check')doCheck();
  else if(act==='next')nextStep();
  else if(act==='hint'){var st=P.seq.steps[P.i]; $('#hintBox').innerHTML='<div class="hintbox"><b>Hint:</b> '+st.hint+'</div>'; if(!P.hinted){P.hinted=true; P.hints++}}
  else if(act==='sol'){ if(a.dataset.sure){var s2=P.seq.steps[P.i]; P.ed.set(s2.sol); P.peeked=true; P.lessonPeek++; a.hidden=true; $('#fb').innerHTML='<div class="banner ok"><b>Here is one way to do it.</b>Read it, then press Check my code to finish this step. You get fewer XP when you peek, and that is fine.</div>'} else {a.dataset.sure=1; a.textContent='Really show it?'} }
  else if(act==='onboard'){ store.name=($('#obName').value||'').trim(); store.goal=+$('#obGoal').value; store.onboarded=true; save(); viewHome(); updateHeader(); toast('All set. Your daily goal is '+store.goal+' minutes.') }
  else if(act==='saveset'){ store.name=($('#setName').value||'').trim(); store.goal=+$('#setGoal').value; store.onboarded=true; save(); toast('Saved.'); viewProfile(); updateHeader() }
  else if(act==='copybk'){ var tx=$('#bk'); try{navigator.clipboard.writeText(tx.value).then(function(){toast('Copied.')},function(){tx.select(); toast('Press Ctrl+C to copy.')})}catch(x){tx.select(); toast('Press Ctrl+C to copy.')} }
  else if(act==='impbk'){ try{var o2=JSON.parse($('#bk').value); if(!o2||o2.v!==1||typeof o2.xp!=='number')throw 0; var f=fresh(); for(var k in f) if(!(k in o2)) o2[k]=f[k]; store=o2; save(); toast('Imported.'); viewProfile(); updateHeader()}catch(x){toast('That text is not a valid backup.')} }
  else if(act==='reset1'){ if(a.dataset.sure){store=fresh(); save(); toast('Progress reset.'); go('home'); updateHeader()} else {a.dataset.sure=1; a.textContent='Click again to erase everything'} }
});
var themeBtn=$('#themeBtn');
function themeLabel(){var cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); themeBtn.textContent=cur==='dark'?'Light':'Dark'}
themeBtn.addEventListener('click',function(){var r=document.documentElement, cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); r.setAttribute('data-theme',cur==='dark'?'light':'dark'); themeLabel()});
themeLabel();

/* ---------- self-test (used while building: runs every exercise solution) ---------- */
window.__selftest=async function(){
  var bad=[], n=0;
  var steps=[]; PC.courses.forEach(function(c){c.lessons.forEach(function(l,li){l.steps.forEach(function(s,si){steps.push([c.id+':'+(li+1)+':'+(si+1),s])})})});
  PC.daily.forEach(function(s,i){steps.push(['daily:'+i,s])});
  for(var i=0;i<steps.length;i++){var id=steps[i][0], s=steps[i][1];
    if(s.k==='learn'){ var r=await execHeadless(s.code||'',['Sam','3','4','5','6']); if(r.err&&!s.mayFail)bad.push(id+' LEARN demo error: '+String(r.err)); n++ }
    else if(s.k==='code'){ n++;
      if(typeof s.sol!=='string'){bad.push(id+' missing solution'); continue}
      var ok=await runChecks(s,s.sol); if(!ok.ok){var f=ok.res.filter(function(x){return !x.ok})[0]; bad.push(id+' SOLUTION FAILS: '+(f.err?String(f.err.type+': '+f.err.msg+' line '+f.err.line):f.msg||('want '+JSON.stringify(f.t.o)+' got '+JSON.stringify(f.got))))}
      var st=await runChecks(s,s.starter); if(st.ok&&!s.allowStarterPass)bad.push(id+' STARTER ALREADY PASSES')
    } else if(s.k==='quiz'){ n++; if(!(s.ans>=0&&s.ans<s.opts.length))bad.push(id+' bad quiz index') }
  }
  PC.warm.forEach(function(q,i){ if(!(q.ans>=0&&q.ans<q.opts.length))bad.push('warm:'+i+' bad index') });
  return {checked:n,problems:bad};
};

/* ---------- start ---------- */
try{ if(!location.hash)history.replaceState(null,'','#home') }catch(e){}
checkBadges(); route();
})();
</script>
